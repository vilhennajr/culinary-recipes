services:
  # ── 1. Database ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: culinary-recipes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: culinary_recipes_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - culinary-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-ppassword",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── 2. Backend API (migrate + seed + start) ──────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: culinary-recipes-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:password@mysql:3306/culinary_recipes_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 24h
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - culinary-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ── 3. Frontend (nginx serving built assets + /api proxy) ────────────────────
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: culinary-recipes-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - culinary-network

volumes:
  mysql_data:

networks:
  culinary-network:
    driver: bridge
