name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: culinary_recipes_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Check formatting
        working-directory: ./backend
        run: npm run format -- --check

      - name: Run unit tests
        working-directory: ./backend
        run: npm run test

      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/culinary_recipes_db_test
        run: npx prisma migrate deploy

      - name: Run E2E tests
        working-directory: ./backend
        env:
          DATABASE_URL: mysql://root:testpassword@localhost:3306/culinary_recipes_db_test
          JWT_SECRET: test-secret-key
          JWT_EXPIRES_IN: 24h
        run: npm run test:e2e

      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t culinary-recipes-api:latest .

      - name: Test Docker image
        run: |
          docker run -d --name test-api \
            -e DATABASE_URL="mysql://root:password@localhost:3306/test" \
            -e JWT_SECRET="test-secret" \
            -e JWT_EXPIRES_IN="24h" \
            culinary-recipes-api:latest
          sleep 5
          docker logs test-api
          docker rm -f test-api
